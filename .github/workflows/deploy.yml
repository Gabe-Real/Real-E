name: Deploy to Cybrancee
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  restart:
    runs-on: ubuntu-latest
    steps:
      - name: Debug - list servers this key can see
        run: |
          curl -sS "${{ secrets.PANEL_URL }}/api/client" \
            -H "Authorization: Bearer ${{ secrets.PANEL_API_KEY }}" \
            -H "Accept: application/json" \
            | jq -r '.data[].attributes | "\(.name) -> \(.identifier)"'

      - name: Debug - list servers this key can see
        run: |
          curl -sS "${{ secrets.PANEL_URL }}/api/client" \
            -H "Authorization: Bearer ${{ secrets.PANEL_API_KEY }}" \
            -H "Accept: application/json" \
            -w "\nHTTP status: %{http_code}\n"