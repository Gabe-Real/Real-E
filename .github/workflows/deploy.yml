name: Deploy to Cybrancee
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  restart:
    runs-on: ubuntu-latest
    steps:
      - name: Debug - raw panel reply
        run: |
          curl -sS "${{ secrets.PANEL_URL }}/api/client" \
            -H "Authorization: Bearer ${{ secrets.PANEL_API_KEY }}" \
            -H "Accept: application/json" \
            -w "\nHTTP status: %{http_code}\n"

      - name: Restart bot (pulls latest code)
        run: |
          curl -sS --fail-with-body -X POST "${{ secrets.PANEL_URL }}/api/client/servers/${{ secrets.SERVER_ID }}/power" \
            -H "Authorization: Bearer ${{ secrets.PANEL_API_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d '{"signal":"restart"}' \
            -w "\nHTTP status: %{http_code}\n"